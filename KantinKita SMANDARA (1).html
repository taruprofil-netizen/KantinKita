function addToCart(pid,vr,note,qty){
  var p=prodById(pid);if(!p||!canBuy(p)){toast('Produk tidak tersedia');return false;}
  var ex=ST.cart.filter(function(i){return i.pid===pid&&i.variant===vr&&i.note===note;})[0];
  var inCart=ST.cart.filter(function(i){return i.pid===pid;}).reduce(function(a,i){return a+i.qty;},0);
  if(inCart+qty>p.stock){toast('Stok '+p.name+' tinggal '+p.stock);return false;}
  if(ex)ex.qty+=qty;else ST.cart.push({pid:pid,variant:vr,note:note,qty:qty});
  toast(p.name+' masuk keranjang');return true;
}

  '<div class="card stack"><h2>Waktu pengambilan</h2>'+opts.map(function(o){return '<label class="row nw" style="padding:10px;border:1px solid '+(ST.pick===o[0]?'var(--brand)':'var(--line)')+';border-radius:12px;cursor:pointer"><input type="radio" name="pick" value="'+o[0]+'" data-i="pick" '+(ST.pick===o[0]?'checked':'')+'><span class="grow"><b>'+o[1]+'</b><div class="small muted">'+o[2]+'</div></span></label>';}).join('')+
  (ST.pick==='khusus'?'<div class="field"><label for="ptime">Jam pengambilan (kantin buka '+S.settings.open+'–'+S.settings.close+')</label><input class="inp" id="ptime" type="time" value="'+ST.pickTime+'" data-i="ptime"></div>':'')+'</div>'+
  '<div class="card stack"><div class="row"><span class="grow muted">Total pembayaran</span><b class="mono">'+rp(tot)+'</b></div><div class="row"><span class="grow muted">Saldo saat ini</span><span class="mono">'+rp(sal)+'</span></div><div class="row"><span class="grow muted">Saldo setelah transaksi</span><b class="mono" style="color:'+(lack?'var(--bad)':'var(--ok)')+'">'+(lack?'-':'')+rp(Math.abs(after))+'</b></div>'+
  (lack?'<div class="demo" style="background:var(--bad-soft);color:var(--bad)" role="alert">Saldo belum cukup. Isi saldo terlebih dahulu sebelum memesan.</div><button class="btn yel block" data-a="nav" data-v="isi">Isi Saldo</button>':'')+
  '<button class="btn block" data-a="checkout" '+(lack?'disabled':'')+'>Konfirmasi Pesanan</button></div></div>';

function doCheckout(){
  if(ST.busy)return;ST.busy=true;
  try{
    var u=me(),tot=cartTotal();
    if(!ST.cart.length){toast('Keranjang kosong');return;}
    var label,time;
    if(ST.pick==='khusus'){time=ST.pickTime;if(!/^\d\d:\d\d$/.test(time)){toast('Isi jam pengambilan');return;}
      if(time<S.settings.open||time>S.settings.close){toast('Jam di luar operasional ('+S.settings.open+'–'+S.settings.close+')');return;}label='Waktu khusus';}
    else{var pl=pickLabel(ST.pick);label=pl[0];time=pl[1];}
    var need={};
    for(var i=0;i<ST.cart.length;i++){var it=ST.cart[i],p=prodById(it.pid);if(!p||!canBuy(p)){toast((p?p.name:'Produk')+' tidak tersedia lagi');return;}need[p.id]=(need[p.id]||0)+it.qty;if(need[p.id]>p.stock){toast('Stok '+p.name+' tinggal '+p.stock);return;}}
    if(saldoOf(u.id)<tot){toast('Saldo tidak cukup. Isi saldo dulu.');return;}
    var items=ST.cart.map(function(it){var p=prodById(it.pid);p.stock-=it.qty;return {pid:p.id,name:p.name,price:priceOf(p,it.variant),qty:it.qty,variant:it.variant,note:it.note,emoji:p.emoji};});
    var code='KK-'+(++S.seq);
    var o={id:'o'+uid(),code:code,uid:u.id,items:items,total:tot,pickup:{type:ST.pick,label:label,time:time},status:'Menunggu Konfirmasi',created:Date.now(),note:ST.pnote,refunded:false,log:[{t:Date.now(),s:'Menunggu Konfirmasi'}]};
    S.orders.push(o);addTx(u.id,'beli',-tot,'Pembayaran pre-order '+code,'',code);
    notify(u.id,'Pesanan '+code+' dibuat dan menunggu konfirmasi petugas. Saldo terpakai '+rp(tot)+'.');
    ST.cart=[];ST.pnote='';ST.tab.pes='aktif';save();toast('Pesanan '+code+' dibuat');go('pesanan');
  }finally{ST.busy=false;}
}

  var prog=!done||o.status==='Selesai'?'<div class="row nw" style="gap:4px" aria-label="Tahap pesanan">'+STAT_ORDER.map(function(s,k){return '<span style="flex:1;height:6px;border-radius:3px;background:'+(k<=ix?'var(--brand)':'var(--line)')+'"></span>';}).join('')+'</div>':'';
  var b='';
  if(!staffView){
    if(['Pesanan Diterima','Sedang Disiapkan','Siap Diambil'].indexOf(o.status)>-1)b+='<button class="btn sm '+(o.status==='Siap Diambil'?'':'sec')+'" data-a="ocode" data-id="'+o.id+'">'+ic('qr')+'Tampilkan kode</button>';
    if(o.status==='Menunggu Konfirmasi')b+='<button class="btn sm bad" data-a="ocancel" data-id="'+o.id+'">Batalkan pesanan</button>';
  }
  return '<article class="card stack" style="gap:10px"><div class="row nw"><div class="grow"><b class="mono">'+esc(o.code)+'</b>'+(u?'<div class="small">'+esc(u.name)+' · <span class="muted">'+esc(u.ident)+'</span></div>':'')+'<div class="small muted">Dipesan '+dt(o.created)+'</div></div>'+pill(o.status)+'</div>'+
  '<div class="row small" style="gap:6px">'+ic('clock')+'<b>'+esc(o.pickup.label)+' · '+esc(o.pickup.time)+'</b>'+(o.pickup.type==='khusus'&&o.status==='Menunggu Konfirmasi'?'<span class="pill warn">Perlu persetujuan</span>':'')+'</div>'+
  orderLines(o)+(o.note?'<div class="small muted">Catatan pesanan: '+esc(o.note)+'</div>':'')+prog+
  '<div class="row"><b class="mono grow">'+rp(o.total)+'</b>'+(o.refunded?'<span class="pill ok">Saldo dikembalikan</span>':'')+b+'</div></article>';

  addTx(o.uid,'refund',o.total,'Pengembalian saldo pesanan '+o.code+' ('+reason+')',actor||'',o.code);
  notify(o.uid,'Pengembalian saldo '+rp(o.total)+' untuk pesanan '+o.code+' berhasil.');

/* ===== bagian petugas ===== */
function today(ts){return dkey(ts)===dkey(Date.now());}
function dashboardView(){
  var os=S.orders.filter(function(o){return today(o.created);}),cnt=function(s){return S.orders.filter(function(o){return o.status===s;}).length;};
  var txT=S.tx.filter(function(t){return today(t.time);});
  var income=os.filter(function(o){return o.status!=='Ditolak'&&o.status!=='Dibatalkan';}).reduce(function(a,o){return a+o.total;},0);
  var cashIn=txT.filter(function(t){return t.type==='isi_tunai';}).reduce(function(a,t){return a+t.amount;},0);
  var cashOut=txT.filter(function(t){return t.type==='tarik';}).reduce(function(a,t){return a-t.amount;},0);
  var wait=S.orders.filter(function(o){return o.status==='Menunggu Konfirmasi';}).sort(function(a,b){return pickKey(a)<pickKey(b)?-1:1;});
  var low=S.products.filter(function(p){return p.cat!=='Internet'&&p.stock<=5;});
  return '<div class="stack" style="gap:16px"><div><div class="muted small">'+greet()+',</div><h1>'+esc(me().name)+'</h1><div class="muted small">Ringkasan hari ini, '+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})+'</div></div>'+
  '<div class="stats"><div class="stat"><b>'+os.length+'</b><span>Pesanan hari ini</span></div><div class="stat"><b style="color:var(--warn)">'+cnt('Menunggu Konfirmasi')+'</b><span>Menunggu konfirmasi</span></div><div class="stat"><b>'+cnt('Sedang Disiapkan')+'</b><span>Sedang disiapkan</span></div><div class="stat"><b style="color:var(--ok)">'+cnt('Siap Diambil')+'</b><span>Siap diambil</span></div><div class="stat"><b>'+txT.length+'</b><span>Transaksi hari ini</span></div><div class="stat"><b class="mono" style="font-size:1.1rem">'+rp(income)+'</b><span>Penjualan hari ini</span></div></div>'+
  '<div class="card stack" style="gap:6px"><h3>Kas tunai hari ini</h3><div class="row"><span class="grow muted">Isi saldo tunai diterima</span><b class="mono amt pos">+'+rp(cashIn)+'</b></div><div class="row"><span class="grow muted">Penarikan tunai diserahkan</span><b class="mono amt neg">-'+rp(cashOut)+'</b></div><div class="row"><span class="grow muted">Kas bersih dari dompet</span><b class="mono">'+rp(cashIn-cashOut)+'</b></div></div>'+
  '<section class="stack"><div class="row"><h2 class="grow">Perlu konfirmasi</h2><button class="btn sm sec" data-a="nav" data-v="s-pesanan">Semua pesanan</button></div>'+(wait.length?wait.slice(0,3).map(function(o){return sOrderBlock(o);}).join(''):'<div class="empty card">Tidak ada pesanan yang menunggu.</div>')+'</section>'+
  '<section class="card stack"><h2>Stok menipis</h2>'+(low.length?low.map(function(p){return '<div class="row nw"><span class="grow">'+p.emoji+' '+esc(p.name)+'</span>'+(p.stock<=0?'<span class="pill bad">Habis</span>':'<span class="pill warn">Sisa '+p.stock+'</span>')+'<button class="btn sm sec" data-a="pedit" data-id="'+p.id+'">Ubah</button></div>';}).join(''):'<div class="muted">Semua stok aman.</div>')+'</section></div>';
}
function sOrderBlock(o){
  var a='';
  var s=o.status;
  if(s==='Menunggu Konfirmasi')a='<button class="btn sm ok" data-a="ost" data-id="'+o.id+'" data-s="Pesanan Diterima">Terima</button><button class="btn sm bad" data-a="orej" data-id="'+o.id+'">Tolak</button>';
  else if(s==='Pesanan Diterima')a='<button class="btn sm" data-a="ost" data-id="'+o.id+'" data-s="Sedang Disiapkan">Mulai siapkan</button><button class="btn sm bad" data-a="orej" data-id="'+o.id+'">Batalkan</button>';
  else if(s==='Sedang Disiapkan')a='<button class="btn sm" data-a="ost" data-id="'+o.id+'" data-s="Siap Diambil">Tandai siap diambil</button><button class="btn sm bad" data-a="orej" data-id="'+o.id+'">Batalkan</button>';
  else if(s==='Siap Diambil')a='<button class="btn sm ok" data-a="overify" data-id="'+o.id+'">'+ic('qr')+'Verifikasi & serahkan</button><button class="btn sm bad" data-a="orej" data-id="'+o.id+'">Batalkan</button>';
  return '<div class="stack" style="gap:6px">'+orderCard(o,true)+(a?'<div class="row">'+a+'</div>':'')+'</div>';
}
function sPesananView(){
  var tab=ST.tab.sp||'aktif',fin=['Selesai','Ditolak','Dibatalkan'];
  var l=S.orders.filter(function(o){return tab==='aktif'?fin.indexOf(o.status)<0:fin.indexOf(o.status)>-1;}).sort(function(a,b){return pickKey(a)<pickKey(b)?-1:pickKey(a)>pickKey(b)?1:a.created-b.created;});
  var groups={},keys=[];l.forEach(function(o){var k=pickKey(o);if(!groups[k]){groups[k]=[];keys.push(k);}groups[k].push(o);});
  var nA=S.orders.filter(function(o){return fin.indexOf(o.status)<0;}).length;
  return '<div class="stack" style="gap:14px"><h1>Pesanan Masuk</h1><div class="tabs"><button class="'+(tab==='aktif'?'on':'')+'" data-a="tab" data-k="sp" data-v="aktif">Aktif ('+nA+')</button><button class="'+(tab==='selesai'?'on':'')+'" data-a="tab" data-k="sp" data-v="selesai">Selesai / batal</button></div>'+
  (keys.length?keys.map(function(k){return '<section class="stack"><h3 class="row">'+ic('clock')+'Pengambilan '+esc(k)+' <span class="pill gray">'+groups[k].length+' pesanan</span></h3>'+groups[k].map(sOrderBlock).join('')+'</section>';}).join(''):'<div class="empty card">Tidak ada pesanan.</div>')+'</div>';

function orderTransition(o,s){
  var order=['Menunggu Konfirmasi','Pesanan Diterima','Sedang Disiapkan','Siap Diambil'];
  if(order.indexOf(o.status)<0||order.indexOf(s)!==order.indexOf(o.status)+1){toast('Status tidak dapat diubah');return false;}
  setStatus(o,s);
  var m={'Pesanan Diterima':'diterima petugas.','Sedang Disiapkan':'sedang disiapkan.','Siap Diambil':'siap diambil pada '+o.pickup.time+'.'}[s];
  notify(o.uid,'Pesanan '+o.code+' '+m);act('Pesanan '+o.code+' menjadi '+s);return true;
}

function confirmReq(r){
  if(r.status!=='Menunggu'||r.used){toast('Kode sudah diproses');return;}
  var st=me().name;r.used=true;
  if(r.kind==='tarik'){
    if(saldoOf(r.uid)<r.amount){r.status='Ditolak';notify(r.uid,'Penarikan '+rp(r.amount)+' ditolak karena saldo tidak cukup.');act('Penarikan '+r.code+' ditolak (saldo kurang)');toast('Ditolak: saldo kurang');return;}
    r.status='Berhasil';addTx(r.uid,'tarik',-r.amount,'Tarik saldo tunai',st,r.code);notify(r.uid,'Penarikan saldo '+rp(r.amount)+' berhasil.');act('Konfirmasi penarikan '+rp(r.amount)+' untuk '+userById(r.uid).name);toast('Penarikan dikonfirmasi');
  }else{
    r.status='Berhasil';addTx(r.uid,'isi_tunai',r.amount,'Isi saldo tunai di kantin',st,r.code);notify(r.uid,'Isi saldo '+rp(r.amount)+' berhasil.');act('Konfirmasi isi saldo tunai '+rp(r.amount)+' untuk '+userById(r.uid).name);toast('Saldo pengguna bertambah');
  }
}

function saveProd(){
  var g=function(i){return document.getElementById(i);};
  var name=g('f-name').value.trim(),price=parseInt(g('f-price').value.replace(/\D/g,''),10),stock=parseInt(g('f-stock').value.replace(/\D/g,''),10);
  var vt=g('f-vt').value,vars=[];
  if(vt==='pedas')vars=V(PEDAS);else if(vt==='rasa')vars=V(RASA);else if(vt==='custom'){vars=g('f-var').value.split(',').map(function(s){return s.trim();}).filter(Boolean).map(function(s){var a=s.split(':');var o={n:a[0].trim()};if(a[1]&&parseInt(a[1],10))o.p=parseInt(a[1],10);return o;});}
  if(!name){toast('Isi nama produk');return;}
  if(isNaN(stock)||stock<0){toast('Isi stok');return;}
  if(isNaN(price))price=0;
  if(!price&&!vars.some(function(v){return v.p;})){toast('Isi harga produk');return;}
  var d={name:name,cat:g('f-cat').value,price:price,stock:stock,desc:g('f-desc').value.trim(),emoji:g('f-emoji').value||'🍽️',variants:vars,available:g('f-av').checked,img:ST.formImg||''};
  if(ST.formId){var p=prodById(ST.formId);for(var k in d)p[k]=d[k];act('Mengubah produk '+name);}
  else{d.id='p'+uid();d.color=COL[{'Makanan':'m','Snack & Jajanan':'s','Minuman':'d','ATK':'a','Perlengkapan Sekolah':'p','Kebutuhan Tambahan':'t','Internet':'i'}[d.cat]];S.products.push(d);act('Menambah produk '+name);}
  save();closeModal();render();toast('Produk disimpan');
}

  var u=me(),adm=u.role==='admin',users=S.users.filter(function(x){return x.role!=='admin'||adm;});
  return '<div class="stack" style="gap:16px"><h1>Pengaturan</h1>'+
  '<form id="sf" class="card stack"><h2>Jam operasional kantin</h2><div class="row nw"><div class="field grow"><label for="s-open">Buka</label><input class="inp" type="time" id="s-open" value="'+S.settings.open+'" '+(adm?'':'disabled')+'></div><div class="field grow"><label for="s-close">Tutup</label><input class="inp" type="time" id="s-close" value="'+S.settings.close+'" '+(adm?'':'disabled')+'></div></div>'+(adm?'<button class="btn" type="submit">Simpan jam</button>':'<div class="small muted">Hanya admin yang dapat mengubah jam operasional.</div>')+'</form>'+
  '<section class="card stack"><h2>Data siswa dan guru</h2><div class="list">'+users.map(function(x){return '<div class="li" style="flex-wrap:wrap">'+avatar(x,40)+'<div class="grow"><b>'+esc(x.name)+'</b><div class="small muted">'+esc(x.ident)+' · '+esc(x.kelas)+'</div></div>'+(x.role==='siswa'||x.role==='guru'?'<b class="mono">'+rp(saldoOf(x.id))+'</b>':'<span class="pill info">'+x.role+'</span>')+(x.active?'':'<span class="pill bad">Nonaktif</span>')+
    (adm&&x.id!==u.id?'<div class="row" style="width:100%"><button class="btn sm ghost" data-a="utog" data-id="'+x.id+'">'+(x.active?'Nonaktifkan':'Aktifkan')+'</button><button class="btn sm ghost" data-a="upw" data-id="'+x.id+'">Reset password</button></div>':'')+'</div>';}).join('')+'</div></section>'+
  (adm?'<form id="af" class="card stack"><h2>Tambah akun</h2><div class="field"><label for="a-name">Nama lengkap</label><input class="inp" id="a-name" required></div><div class="row nw"><div class="field grow"><label for="a-role">Jenis akun</label><select class="inp" id="a-role"><option value="siswa">Siswa</option><option value="guru">Guru</option><option value="petugas">Petugas kantin</option></select></div><div class="field grow"><label for="a-nis">NIS/NIP</label><input class="inp" id="a-nis"></div></div><div class="field"><label for="a-kelas">Kelas atau jabatan</label><input class="inp" id="a-kelas"></div><div class="field"><label for="a-pw">Password awal</label><input class="inp" id="a-pw" required></div><button class="btn" type="submit">Tambah akun</button></form>':'')+
  '<section class="card stack"><h2>Aktivitas petugas</h2>'+(S.acts.length?S.acts.slice().reverse().slice(0,15).map(function(a){return '<div class="small"><b>'+esc(a.staff)+'</b> · '+esc(a.text)+'<div class="muted">'+dt(a.time)+'</div></div>';}).join(''):'<div class="muted">Belum ada aktivitas.</div>')+'</section>'+
  (adm?'<button class="btn ghost block" data-a="resetdemo">Reset data demo</button>':'')+'</div>';
}

/* ===== render dan aksi ===== */
var UV={beranda:berandaView,katalog:katalogView,keranjang:keranjangView,checkout:checkoutView,pesanan:pesananView,dompet:dompetView,isi:isiView,tarik:tarikView,req:reqView,profil:profilView,notif:notifView};
var SV={dashboard:dashboardView,'s-pesanan':sPesananView,'s-produk':sProdukView,'s-isi':function(){return sScanView('isi');},'s-tarik':function(){return sScanView('tarik');},'s-transaksi':sTransaksiView,'s-pengaturan':sPengaturanView};
function render(){
  var app=document.getElementById('app');
  if(!ST.me||!me()){ST.me=null;app.innerHTML=loginView();return;}
  var st=isStaff(),map=st?SV:UV;
  if(!map[ST.view])ST.view=st?'dashboard':'beranda';
  app.innerHTML=shell(map[ST.view]());
}
function readImage(file,max,cb){
  if(!file)return;var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8));};im.onerror=function(){toast('Gambar tidak bisa dibaca');};im.src=fr.result;};
  fr.readAsDataURL(file);
}
function byId(list,id){return list.filter(function(x){return x.id===id;})[0];}
var A={
nav:function(d){if(d.v==='isi'||d.v==='tarik'){}go(d.v);},
fill:function(d){document.getElementById('lu').value=d.u;document.getElementById('lp').value=d.p;},
logout:function(){ST.me=null;ST.cart=[];ST.err='';go('login');},
cat:function(d){ST.cat=d.c;render();},
gocat:function(d){ST.cat=d.c;ST.q='';go('katalog');},
pcat:function(d){ST.pcat=d.c;render();},
tab:function(d){ST.tab[d.k]=d.v;render();},
add:function(d){var p=prodById(d.id);if(!p||!canBuy(p)){toast('Produk tidak tersedia');return;}
  if(p.variants.length||p.cat==='Makanan'||p.cat==='Internet'){showModal(addSheet(p));updAdd();}else{if(addToCart(p.id,'','',1))render();}},
mclose:function(d,e){if(e.target.classList.contains('modal'))closeModal();},
mclose2:function(){closeModal();},
aq:function(d){var p=prodById(ST.addP),inC=ST.cart.filter(function(i){return i.pid===p.id;}).reduce(function(a,i){return a+i.qty;},0);var n=ST.addQty+parseInt(d.d,10);if(n<1)n=1;if(n>p.stock-inC){n=Math.max(1,p.stock-inC);toast('Stok tinggal '+p.stock);}ST.addQty=n;document.getElementById('aqv').textContent=n;updAdd();},
addgo:function(){var p=prodById(ST.addP),note=document.getElementById('addnote').value.trim();if(p.cat==='Internet'&&!/\d{8,}/.test(note.replace(/\D/g,'')+'')){toast('Isi nomor HP di catatan');return;}
  if(addToCart(p.id,curVar(),note,ST.addQty)){closeModal();render();}},
cq:function(d){var i=ST.cart[+d.i],p=prodById(i.pid),n=i.qty+parseInt(d.d,10);var tot=ST.cart.filter(function(x){return x.pid===p.id;}).reduce(function(a,x){return a+x.qty;},0)+parseInt(d.d,10);
  if(n<1){ST.cart.splice(+d.i,1);}else if(tot>p.stock){toast('Stok tinggal '+p.stock);return;}else i.qty=n;render();},
crm:function(d){ST.cart.splice(+d.i,1);render();},
checkout:function(){doCheckout();},
ocode:function(d){showModal(orderCodeSheet(byId(S.orders,d.id)));},
ocancel:function(d){var o=byId(S.orders,d.id);if(!o||o.status!=='Menunggu Konfirmasi'){toast('Pesanan sudah diproses petugas');render();return;}setStatus(o,'Dibatalkan');refundOrder(o,'dibatalkan pengguna','');save();render();toast('Pesanan dibatalkan, saldo kembali');},
txd:function(d){showModal(txDetail(byId(S.tx,d.id)));},
tmode:function(d){ST.topup.mode=d.v;render();},
preset:function(d){document.getElementById('amt').value=d.v;if(ST.view==='tarik')ST.wd.amount=d.v;else ST.topup.amount=d.v;},
mkisi:function(){var a=parseAmt();if(a<5000||a>500000){toast('Nominal 5.000 sampai 500.000');return;}ST.topup.amount='';if(ST.topup.mode==='online')mkReq('isi_online',a,ST.topup.method);else mkReq('isi',a,'Tunai');},
mkwd:function(){var a=parseAmt(),s=saldoOf(ST.me);if(a<5000){toast('Minimal penarikan Rp5.000');return;}if(a>s){toast('Nominal melebihi saldo ('+rp(s)+')');return;}ST.wd.amount='';mkReq('tarik',a,'Tunai');},
req:function(d){go('req',d.id);},
paydemo:function(d){var r=byId(S.reqs,d.id);if(!r||r.status!=='Menunggu'||r.used){toast('Pembayaran sudah diproses');return;}r.used=true;r.status='Berhasil';addTx(r.uid,'isi_online',r.amount,'Isi saldo online via '+r.method+' (DEMO)','Sistem (DEMO)',r.code,r.method);notify(r.uid,'Isi saldo '+rp(r.amount)+' via '+r.method+' berhasil (DEMO).');save();render();toast('Saldo bertambah '+rp(r.amount));},
reqcancel:function(d){var r=byId(S.reqs,d.id);if(!r||r.status!=='Menunggu'){toast('Kode sudah diproses');render();return;}r.status='Dibatalkan';r.used=true;save();render();toast('Dibatalkan');},
resetdemo:function(){try{localStorage.removeItem(VER);}catch(e){}seed();save();ST.me=null;ST.cart=[];ST.view='login';render();toast('Data demo dikembalikan');},
/* petugas */
ost:function(d){if(!isStaff())return;var o=byId(S.orders,d.id);if(o&&orderTransition(o,d.s)){save();render();toast('Status: '+d.s);}},
orej:function(d){if(!isStaff())return;var o=byId(S.orders,d.id);if(!o||['Selesai','Ditolak','Dibatalkan'].indexOf(o.status)>-1){toast('Pesanan sudah final');return;}var rej=o.status==='Menunggu Konfirmasi';setStatus(o,rej?'Ditolak':'Dibatalkan');refundOrder(o,rej?'ditolak petugas':'dibatalkan petugas',me().name);notify(o.uid,'Pesanan '+o.code+(rej?' ditolak':' dibatalkan')+' petugas.');act('Pesanan '+o.code+(rej?' ditolak':' dibatalkan')+', saldo dikembalikan');save();render();toast('Saldo pengguna dikembalikan');},
overify:function(d){if(!isStaff())return;showModal(verifySheet(byId(S.orders,d.id)));},
overifygo:function(d){if(!isStaff())return;var o=byId(S.orders,d.id),c=document.getElementById('vcode').value.trim().toUpperCase();if(!o||o.status!=='Siap Diambil'){toast('Pesanan tidak bisa diserahkan');return;}if(c!==o.code){toast('Kode tidak cocok');return;}setStatus(o,'Selesai');notify(o.uid,'Pesanan '+o.code+' sudah diambil. Terima kasih.');act('Menyerahkan pesanan '+o.code+' kepada '+userById(o.uid).name);save();closeModal();render();toast('Pesanan selesai');},
scanfind:function(d){var c=(document.getElementById('scan').value||'').trim().toUpperCase();var r=S.reqs.filter(function(x){return x.code===c&&x.kind===d.k;})[0];if(!r){toast('Kode tidak ditemukan');return;}if(r.status!=='Menunggu'){toast('Kode sudah diproses ('+r.status+')');return;}showModal(reqSheet(r));},
sscan:function(d){showModal(reqSheet(byId(S.reqs,d.id)));},
sconfirm:function(d){if(!isStaff())return;var r=byId(S.reqs,d.id);confirmReq(r);ST.scan='';save();closeModal();render();},
sreject:function(d){if(!isStaff())return;var r=byId(S.reqs,d.id);if(r.status!=='Menunggu'){toast('Kode sudah diproses');return;}r.status='Ditolak';r.used=true;notify(r.uid,(r.kind==='tarik'?'Penarikan':'Isi saldo')+' '+rp(r.amount)+' ditolak petugas.');act('Menolak '+r.code);save();closeModal();render();toast('Ditolak');},
padd:function(){showModal(prodForm(null));},
pedit:function(d){showModal(prodForm(prodById(d.id)));},
psave:function(){if(!isStaff())return;saveProd();},
'pphoto-rm':function(){ST.formImg='';var n=document.getElementById('pphn');if(n)n.textContent='Foto dihapus (simpan untuk menerapkan)';},
ptoggle:function(d){if(!isStaff())return;var p=prodById(d.id);p.available=!p.available;act((p.available?'Mengaktifkan ':'Menonaktifkan ')+p.name);save();render();},
sadj:function(d){if(!isStaff())return;var p=prodById(d.id);p.stock=Math.max(0,p.stock+parseInt(d.d,10));act('Stok '+p.name+' menjadi '+p.stock);save();render();},
pdel:function(d){var p=prodById(d.id);showModal('<div class="modal" data-a="mclose"><div class="sheet" role="dialog" aria-modal="true" aria-label="Hapus produk"><h2>Hapus '+esc(p.name)+'?</h2><div class="muted">Produk hilang dari katalog. Pesanan lama tetap tersimpan.</div><div class="row"><button class="btn bad grow" data-a="pdelgo" data-id="'+p.id+'">Hapus</button><button class="btn ghost grow" data-a="mclose2">Batal</button></div></div></div>');},
pdelgo:function(d){if(!isStaff())return;var p=prodById(d.id);S.products=S.products.filter(function(x){return x.id!==d.id;});ST.cart=ST.cart.filter(function(i){return i.pid!==d.id;});act('Menghapus produk '+p.name);save();closeModal();render();toast('Produk dihapus');},
tclear:function(){ST.tdate='';render();},
utog:function(d){var u=userById(d.id);u.active=!u.active;act((u.active?'Mengaktifkan':'Menonaktifkan')+' akun '+u.name);save();render();},
upw:function(d){var u=userById(d.id);u.password='kantin'+Math.floor(1000+Math.random()*9000);act('Reset password '+u.name);save();showModal('<div class="modal" data-a="mclose"><div class="sheet" role="dialog" aria-modal="true"><h2>Password baru</h2><div class="muted small">Untuk '+esc(u.name)+'. Catat dan sampaikan ke pemilik akun.</div><div class="code">'+esc(u.password)+'</div><button class="btn block" data-a="mclose2">Selesai</button></div></div>');}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(!el)return;var fn=A[el.dataset.a];if(fn)fn(el.dataset,e);else if(el.dataset.a==='mclose'){}save();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ST.modal)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.tagName==='LABEL'&&e.target.htmlFor){e.preventDefault();var f=document.getElementById(e.target.htmlFor);if(f)f.click();}});
function onIn(e){
  var el=e.target,k=el.dataset?el.dataset.i:null;if(!k)return;
  if(k==='kq'){ST.q=el.value;var l=document.getElementById('catlist');if(l)l.innerHTML=catList(filterProds(ST.cat,ST.q));}
  else if(k==='sq'){ST.pq=el.value;var l2=document.getElementById('plist');if(l2)l2.innerHTML=pList(filterProds(ST.pcat,ST.pq));}
  else if(k==='pnote')ST.pnote=el.value;
  else if(k==='pick'&&e.type==='change'){ST.pick=el.value;render();}
  else if(k==='ptime')ST.pickTime=el.value;
  else if(k==='var')updAdd();
  else if(k==='amt'){if(ST.view==='tarik')ST.wd.amount=el.value;else ST.topup.amount=el.value;}
  else if(k==='pay')ST.topup.method=el.value;
  else if(k==='scan')ST.scan=el.value;
  else if(k==='tdate'&&e.type==='change'){ST.tdate=el.value;render();}
  else if(k==='photo'&&e.type==='change'){readImage(el.files[0],240,function(d){me().photo=d;save();render();toast('Foto profil diperbarui');});}
  else if(k==='pphoto'&&e.type==='change'){readImage(el.files[0],640,function(d){ST.formImg=d;var n=document.getElementById('pphn');if(n)n.textContent='Foto siap disimpan';});}
}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
document.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(id==='lf')doLogin();
  else if(id==='hf'){ST.q=document.getElementById('hq').value;ST.cat='Semua';go('katalog');}
  else if(id==='sf'&&me().role==='admin'){var o=document.getElementById('s-open').value,c=document.getElementById('s-close').value;if(!o||!c||o>=c){toast('Jam tutup harus setelah jam buka');return;}S.settings.open=o;S.settings.close=c;act('Jam operasional '+o+'–'+c);save();render();toast('Jam operasional disimpan');}
  else if(id==='af'&&me().role==='admin'){var g=function(i){return document.getElementById(i).value.trim();};var nm=g('a-name'),rl=g('a-role'),nis=g('a-nis');
    var un=nm.split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g,'')+Math.floor(10+Math.random()*90);
    if(nis&&S.users.some(function(u){return u.nis===nis;})){toast('NIS/NIP sudah terdaftar');return;}
    S.users.push({id:'u'+uid(),role:rl,username:un,nis:nis,password:g('a-pw'),name:nm,ident:rl==='petugas'?'Petugas Kantin':(rl==='guru'?'NIP ':'NIS ')+nis,kelas:g('a-kelas')||'-',color:'#475569',photo:'',active:true});
    act('Menambah akun '+nm);save();render();toast('Akun dibuat. Username: '+un);}
});
render();
})();
